# Build iotdb-rel/1.0, master, iot-benchmark
# Everyday
name: iotdb 每日发布
on:
#  push:
#    branches:
#      - master
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    outputs:
      date: ${{ steps.sys-info.outputs.date }}
    steps:
      - name: collect common info
        shell: bash
        id: sys-info
        run: echo "date=$(date +"%Y-%m-%d")" >> $GITHUB_OUTPUT
#----start----
  create-release:
    needs: collect
    runs-on: ubuntu-latest
    steps:
      - name: Create release
        id: create-release
        uses: ncipollo/release-action@v1.20.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ needs.collect.outputs.date }}-apache-iotdb
          prerelease: false
          draft: false
          body: ${{ needs.collect.outputs.date }} apache iotdb
          name: ${{ needs.collect.outputs.date }} apache iotdb
#----end----

#----start----
# master 分支的 c++ iotdb-session windows 客户端。
# 依赖安装和构建命令对齐 apache/iotdb 官方 .github/workflows/client-cpp-package.yml
# (windows-vs2022 变体)。
  build-in-win:
    needs: [ collect,create-release ]
    runs-on: windows-2022
    steps:
      - name: Set java 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: 'temurin'

      - name: Install C++ dependencies (Windows)
        shell: pwsh
        run: |
          choco install winflexbison3 -y --no-progress
          choco install boost-msvc-14.3 -y --no-progress
          if (-not (Test-Path 'C:\local')) {
            New-Item -ItemType Directory -Path 'C:\local' -Force | Out-Null
          }
          $boostDir = Get-ChildItem -Path 'C:\local\' -Filter 'boost_*' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $boostDir) {
            throw "Boost not found under C:\local after installing boost-msvc-14.3"
          }
          echo $boostDir.FullName >> $env:GITHUB_PATH
          # 固定 OpenSSL 3.x：choco 的 openssl 现在是 4.0，会删掉 thrift 仍在使用的
          # legacy TLS-method API，导致链接失败。
          $sslZip = "$env:RUNNER_TEMP\openssl-3.5.3.zip"
          $sslDir = "$env:RUNNER_TEMP\openssl-3"
          curl.exe -L --fail --retry 3 -o $sslZip 'https://download.firedaemon.com/FireDaemon-OpenSSL/openssl-3.5.3.zip'
          Expand-Archive -Path $sslZip -DestinationPath $sslDir -Force
          $sslPath = (Get-ChildItem $sslDir -Recurse -Directory -Filter 'x64' | Select-Object -First 1).FullName
          if (-not $sslPath) { throw "OpenSSL x64 dir not found under $sslDir" }
          echo "$sslPath\bin" >> $env:GITHUB_PATH
          echo "OPENSSL_ROOT_DIR=$sslPath" >> $env:GITHUB_ENV

      - name: Checkout apache/iotdb
        uses: actions/checkout@v5
        with:
          path: iotdb
          repository: 'apache/iotdb'
          ref: master
          fetch-depth: 0

      - name: Collect IoTDB info
        id: iotdb-info
        shell: bash
        run: |
          mkdir -p upload
          cd iotdb
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "branch=$(git symbolic-ref --short HEAD 2>/dev/null || echo master)" >> "$GITHUB_OUTPUT"
          echo "version=$(cat pom.xml | grep -e '^    <version>' | sed 's# ##g' | sed 's#<version>##g' | sed 's#</version>##g')" >> "$GITHUB_OUTPUT"

      - name: Build client-cpp on master branch
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE/iotdb"
          ./mvnw clean package -P with-cpp -pl iotdb-client/client-cpp -am -DskipTests \
            -Dspotless.skip=true \
            -Dclient.cpp.package.classifier=windows-x86_64-msvc14.3

      - name: Move client-cpp file to upload folder
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE/iotdb"
          shopt -s nullglob
          zips=(iotdb-client/client-cpp/target/iotdb-session-cpp-*-windows-x86_64-msvc14.3.zip)
          if [ "${#zips[@]}" -ne 1 ]; then
            echo "expected exactly one package zip, got: ${zips[*]:-(none)}"
            exit 1
          fi
          base="apache-iotdb-session-cpp-x86_64-windows-2022-master-${{ steps.iotdb-info.outputs.version }}-${{ steps.iotdb-info.outputs.commit }}-java17"
          mv "${zips[0]}" "$GITHUB_WORKSPACE/upload/${base}.zip"
          if [ -f "${zips[0]}.sha512" ]; then
            mv "${zips[0]}.sha512" "$GITHUB_WORKSPACE/upload/${base}.zip.sha512"
          fi
          ls -l "$GITHUB_WORKSPACE/upload"

      - name: Upload client-cpp on master branch using 17 on windows-2022
        uses: ncipollo/release-action@v1.20.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ needs.collect.outputs.date }}-apache-iotdb
          prerelease: false
          draft: false
          body: ${{ needs.collect.outputs.date }} apache iotdb
          name: ${{ needs.collect.outputs.date }} apache iotdb
          allowUpdates: true
          artifactErrorsFailBuild: true
          artifacts: "upload/apache-iotdb-session-cpp-x86_64-windows-2022-master-${{ steps.iotdb-info.outputs.version }}-${{ steps.iotdb-info.outputs.commit }}-java17.zip,upload/apache-iotdb-session-cpp-x86_64-windows-2022-master-${{ steps.iotdb-info.outputs.version }}-${{ steps.iotdb-info.outputs.commit }}-java17.zip.sha512"
#
#----end----

#----start----
# 每天用 apache/iotdb 最新的 release tag（v* 稳定版本）打包一份
# c++ iotdb-session windows 客户端。
  build-latest-tag-win:
    needs: [ collect,create-release ]
    runs-on: windows-2022
    steps:
      - name: Resolve latest stable release tag
        id: resolve-tag
        shell: bash
        run: |
          latest_tag=$(git ls-remote --tags --refs https://github.com/apache/iotdb.git \
            | awk -F/ '{print $NF}' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V | tail -n1)
          if [ -z "${latest_tag}" ]; then
            echo "no stable v* tag found" >&2
            exit 1
          fi
          echo "latest_tag=${latest_tag}"
          echo "latest_tag=${latest_tag}" >> "$GITHUB_OUTPUT"

      - name: Set java 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: 'temurin'

      - name: Install C++ dependencies (Windows)
        shell: pwsh
        run: |
          choco install winflexbison3 -y --no-progress
          choco install boost-msvc-14.3 -y --no-progress
          if (-not (Test-Path 'C:\local')) {
            New-Item -ItemType Directory -Path 'C:\local' -Force | Out-Null
          }
          $boostDir = Get-ChildItem -Path 'C:\local\' -Filter 'boost_*' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $boostDir) {
            throw "Boost not found under C:\local after installing boost-msvc-14.3"
          }
          echo $boostDir.FullName >> $env:GITHUB_PATH
          # 固定 OpenSSL 3.x：choco 的 openssl 现在是 4.0，会删掉 thrift 仍在使用的
          # legacy TLS-method API，导致链接失败。
          $sslZip = "$env:RUNNER_TEMP\openssl-3.5.3.zip"
          $sslDir = "$env:RUNNER_TEMP\openssl-3"
          curl.exe -L --fail --retry 3 -o $sslZip 'https://download.firedaemon.com/FireDaemon-OpenSSL/openssl-3.5.3.zip'
          Expand-Archive -Path $sslZip -DestinationPath $sslDir -Force
          $sslPath = (Get-ChildItem $sslDir -Recurse -Directory -Filter 'x64' | Select-Object -First 1).FullName
          if (-not $sslPath) { throw "OpenSSL x64 dir not found under $sslDir" }
          echo "$sslPath\bin" >> $env:GITHUB_PATH
          echo "OPENSSL_ROOT_DIR=$sslPath" >> $env:GITHUB_ENV

      - name: Checkout apache/iotdb at latest tag
        uses: actions/checkout@v5
        with:
          path: iotdb
          repository: 'apache/iotdb'
          ref: ${{ steps.resolve-tag.outputs.latest_tag }}
          fetch-depth: 0

      - name: Collect IoTDB info
        id: iotdb-info
        shell: bash
        run: |
          mkdir -p upload
          cd iotdb
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$(cat pom.xml | grep -e '^    <version>' | sed 's# ##g' | sed 's#<version>##g' | sed 's#</version>##g')" >> "$GITHUB_OUTPUT"

      - name: Build client-cpp on ${{ steps.resolve-tag.outputs.latest_tag }} tag
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE/iotdb"
          ./mvnw clean package -P with-cpp -pl iotdb-client/client-cpp -am -DskipTests \
            -Dspotless.skip=true \
            -Dclient.cpp.package.classifier=windows-x86_64-msvc14.3

      - name: Move client-cpp file to upload folder
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE/iotdb"
          shopt -s nullglob
          zips=(iotdb-client/client-cpp/target/iotdb-session-cpp-*-windows-x86_64-msvc14.3.zip)
          if [ "${#zips[@]}" -ne 1 ]; then
            echo "expected exactly one package zip, got: ${zips[*]:-(none)}"
            exit 1
          fi
          base="apache-iotdb-session-cpp-x86_64-windows-2022-${{ steps.resolve-tag.outputs.latest_tag }}-${{ steps.iotdb-info.outputs.version }}-${{ steps.iotdb-info.outputs.commit }}-java17"
          mv "${zips[0]}" "$GITHUB_WORKSPACE/upload/${base}.zip"
          if [ -f "${zips[0]}.sha512" ]; then
            mv "${zips[0]}.sha512" "$GITHUB_WORKSPACE/upload/${base}.zip.sha512"
          fi
          ls -l "$GITHUB_WORKSPACE/upload"

      - name: Upload client-cpp on ${{ steps.resolve-tag.outputs.latest_tag }} tag using 17 on windows-2022
        uses: ncipollo/release-action@v1.20.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ needs.collect.outputs.date }}-apache-iotdb
          prerelease: false
          draft: false
          body: ${{ needs.collect.outputs.date }} apache iotdb
          name: ${{ needs.collect.outputs.date }} apache iotdb
          allowUpdates: true
          artifactErrorsFailBuild: true
          artifacts: "upload/apache-iotdb-session-cpp-x86_64-windows-2022-${{ steps.resolve-tag.outputs.latest_tag }}-${{ steps.iotdb-info.outputs.version }}-${{ steps.iotdb-info.outputs.commit }}-java17.zip,upload/apache-iotdb-session-cpp-x86_64-windows-2022-${{ steps.resolve-tag.outputs.latest_tag }}-${{ steps.iotdb-info.outputs.version }}-${{ steps.iotdb-info.outputs.commit }}-java17.zip.sha512"
#----end----

#----start----
  build-in-linux:
    needs: [ collect,create-release ]
    runs-on: ubuntu-latest
    steps:
      - name: Set java 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: 'temurin'
      - name: Checkout apache/iotdb
        uses: actions/checkout@v5
        with:
          path: iotdb
          repository: 'apache/iotdb'
          ref: master
          fetch-depth: 0
#collect-iotdb
      - name: Collect IoTDB info
        id: iotdb-info
        run: |
          sudo apt-get install -y python3-pip libboost-all-dev
          pip3 install setuptools
          pip3 install wheel
          pip3 install build

          cd ${{ github.workspace }}/iotdb
          echo "commit=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "branch=$(git symbolic-ref --short HEAD 2>/dev/null || echo master)" >> $GITHUB_OUTPUT
          echo "version=$(cat pom.xml | grep -e '^    <version>' | sed 's# ##g' | sed 's#<version>##g' | sed 's#</version>##g')" >> $GITHUB_OUTPUT
#
#build-iotdb
      - name: Only build iotdb-client-cpp in master on ubuntu-latest
        shell: bash
        run: |
          cd ${{ github.workspace }}/iotdb
          ./mvnw clean package -P with-cpp -pl iotdb-client/client-cpp -am -DskipTests -Dspotless.skip=true

          shopt -s nullglob
          cpp_zips=(iotdb-client/client-cpp/target/iotdb-session-cpp-*-linux-x86_64-glibc2.28.zip)
          if [ "${#cpp_zips[@]}" -ne 1 ]; then
            echo "expected exactly one client-cpp zip, got: ${cpp_zips[*]:-(none)}"
            exit 1
          fi
          base="apache-iotdb-session-cpp-x86_64-ubuntu-latest-master-${{ steps.iotdb-info.outputs.version }}-${{ steps.iotdb-info.outputs.commit }}-java17"
          mv "${cpp_zips[0]}" "${{ github.workspace }}/${base}.zip"
          if [ -f "${cpp_zips[0]}.sha512" ]; then
            mv "${cpp_zips[0]}.sha512" "${{ github.workspace }}/${base}.zip.sha512"
          fi
          ls -l ${{ github.workspace }}

      - name: Build iotdb in master on ubuntu-latest
        shell: bash
        run: |
          cd ${{ github.workspace }}/iotdb
          ./mvnw clean
          ./mvnw install -pl iotdb-api/udf-api -DskipTests -Dspotless.skip=true -P get-jar-with-dependencies

          ./mvnw package -DskipTests -Dspotless.skip=true -am -pl library-udf,iotdb-client/jdbc,iotdb-client/client-py,distribution -P get-jar-with-dependencies

          cd ${{ github.workspace }}/iotdb/iotdb-client/client-py
          # 等价于 release.sh，但使用 ./mvnw（master 需要 maven 3.9，runner 自带版本过旧）
          rm -Rf build
          rm -Rf dist
          rm -Rf iotdb_session.egg_info
          rm -f pyproject.toml
          # (Re-)build generated code
          (cd ../.. && ./mvnw clean package -pl iotdb-client/client-py -am -DskipTests -Dspotless.skip=true)
          python3 -m build
          cd dist
          export client_py_whl_name=$(ls apache_iotdb-*.whl)

          cd ${{ github.workspace }}
          base="apache-iotdb"
          branch=${{ steps.iotdb-info.outputs.branch }}
          version=${{ steps.iotdb-info.outputs.version }}
          commit=${{ steps.iotdb-info.outputs.commit }}

          mv ${{ github.workspace }}/iotdb/distribution/target/apache-iotdb-${version}-library-udf-bin.zip ${{ github.workspace }}/${base}-library-udf-bin-${branch}-${version}-${commit}-java17.zip
          mv ${{ github.workspace }}/iotdb/distribution/target/apache-iotdb-${version}-all-bin.zip ${{ github.workspace }}/${base}-all-bin-${branch}-${version}-${commit}-java17.zip
          mv ${{ github.workspace }}/iotdb/iotdb-client/jdbc/target/iotdb-jdbc-${version}-jar-with-dependencies.jar ${{ github.workspace }}/${base}-jdbc-jar-with-dependencies-${branch}-${version}-${commit}-java17.jar
          mv ${{ github.workspace }}/iotdb/iotdb-client/client-py/dist/${client_py_whl_name} ${{ github.workspace }}/apache_iotdb-py2.py3-none-any-${branch}-${version}-${commit}-java17.whl

          ls -l ${{ github.workspace }}
#
#upload on master
      - name: Upload distribution on master using 17
        uses: ncipollo/release-action@v1.20.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ needs.collect.outputs.date }}-apache-iotdb
          prerelease: false
          draft: false
          body: ${{ needs.collect.outputs.date }} apache iotdb
          name: ${{ needs.collect.outputs.date }} apache iotdb
          allowUpdates: true
          artifactErrorsFailBuild: true
          artifacts: "${{ github.workspace }}/apache-iotdb-all-bin-${{ steps.iotdb-info.outputs.branch }}-${{ steps.iotdb-info.outputs.version }}-${{ steps.iotdb-info.outputs.commit }}-java17.zip,${{ github.workspace }}/apache-iotdb-jdbc-jar-with-dependencies-${{ steps.iotdb-info.outputs.branch }}-${{ steps.iotdb-info.outputs.version }}-${{ steps.iotdb-info.outputs.commit }}-java17.jar,${{ github.workspace }}/apache_iotdb-py2.py3-none-any-${{ steps.iotdb-info.outputs.branch }}-${{ steps.iotdb-info.outputs.version }}-${{ steps.iotdb-info.outputs.commit }}-java17.whl,${{ github.workspace }}/apache-iotdb-library-udf-bin-${{ steps.iotdb-info.outputs.branch }}-${{ steps.iotdb-info.outputs.version }}-${{ steps.iotdb-info.outputs.commit }}-java17.zip"
      - name: Only upload iotdb-client-cpp on master using 17
        uses: ncipollo/release-action@v1.20.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ needs.collect.outputs.date }}-apache-iotdb
          prerelease: false
          draft: false
          body: ${{ needs.collect.outputs.date }} apache iotdb
          name: ${{ needs.collect.outputs.date }} apache iotdb
          allowUpdates: true
          artifactErrorsFailBuild: true
          artifacts: "${{ github.workspace }}/apache-iotdb-session-cpp-x86_64-ubuntu-latest-master-${{ steps.iotdb-info.outputs.version }}-${{ steps.iotdb-info.outputs.commit }}-java17.zip,${{ github.workspace }}/apache-iotdb-session-cpp-x86_64-ubuntu-latest-master-${{ steps.iotdb-info.outputs.version }}-${{ steps.iotdb-info.outputs.commit }}-java17.zip.sha512"

#----end----

#----start----
  build-benchmark:
    needs: [ collect,create-release ]
    runs-on: ubuntu-latest
    steps:
# set java
      - name: Set java 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: 'zulu'
# clone iot-benchmark
      - name: Checkout iot-benchmark
        uses: actions/checkout@v5
        with:
          path: iot-benchmark
          repository: 'thulab/iot-benchmark'
          ref: master
          fetch-depth: 0
      - name: Collect benchmark info
        id: benchmark-info
        run: |
          cd ${{ github.workspace }}/iot-benchmark
          echo "commit=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "release_db_space=$(echo iotdb-1.3 influxdb influxdb-2.0 timescaledb timescaledb-cluster tdengine-3.0 iotdb-2.0)" >> $GITHUB_OUTPUT
          echo "release_db_comma=$(echo iotdb-1.3,influxdb,influxdb-2.0,timescaledb,timescaledb-cluster,tdengine-3.0,iotdb-2.0)" >> $GITHUB_OUTPUT

      #
# build iot-benchmark
      - name: Build benchmark
        run: |
          cd ${{ github.workspace }}/iot-benchmark
          mvn clean package -DskipTests -Dspotless.skip=true -am -pl core,${{ steps.benchmark-info.outputs.release_db_comma }}
          for i in ${{ steps.benchmark-info.outputs.release_db_space }}; do mv ${{ github.workspace }}/iot-benchmark/${i}/target/iot-benchmark-$i.zip ${{ github.workspace }}/iot-benchmark-$i-${{ steps.benchmark-info.outputs.commit }}-java17.zip; done
          ls -l ${{ github.workspace }}
#---upload
      - name: Upload iot-benchmark-*.zip using 17
        uses: ncipollo/release-action@v1.20.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ needs.collect.outputs.date }}-apache-iotdb
          prerelease: false
          draft: false
          body: ${{ needs.collect.outputs.date }} apache iotdb
          name: ${{ needs.collect.outputs.date }} apache iotdb
          allowUpdates: true
          artifactErrorsFailBuild: true
          artifacts: "${{ github.workspace }}/iot-benchmark-*-java17.zip"
#----end----
